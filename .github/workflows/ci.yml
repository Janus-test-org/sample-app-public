# The workflow of the sample application on GitHub.
#
# - `test` runs the tests, for every push and every pull request.
# - `deploy` runs on a push to `main` only. It deploys nothing: it exists so that the
#   repository has an environment with a deployment to read.
#
# It holds no secret and publishes nothing.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --version
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Nothing is deployed. This job only records a deployment."
